<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 320px;
      padding: 12px;
      margin: 0;
      background-color: #f8f9fa;
    }
    h2 {
      font-size: 15px;
      margin-top: 0;
      color: #333;
      border-bottom: 2px solid #6c5ce7;
      padding-bottom: 6px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #555;
    }
    select, textarea, input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      height: 110px;
      resize: vertical;
    }
    button {
      width: 100%;
      background-color: #6c5ce7;
      color: white;
      border: none;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #5a4bcf;
    }
    .info {
      font-size: 11px;
      color: #777;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h2>FP Virtual - Enviar Correo</h2>

  <div class="form-group">
    <label for="courseSelect">1.4 Selector de cursos:</label>
    <select id="courseSelect">
      <option value="all">Todos (por defecto)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="daysSelect">1.1 Días de inactividad:</label>
    <select id="daysSelect">
      <option value="10" selected>Más de 10 días</option>
      <option value="7-10">Entre 7 y 10 días</option>
    </select>
  </div>

  <div class="form-group">
    <label for="accessSelect">1.2 Estado de acceso:</label>
    <select id="accessSelect">
      <option value="no_access" selected>Sin acceder al curso</option>
      <option value="never">Nunca han accedido</option>
    </select>
  </div>

  <div class="form-group">
    <label for="messageText">1.3 Mensaje a enviar:</label>
    <textarea id="messageText">Buenos días,

En el módulo de [NombreDelMódulo] se ha detectado falta de actividad por un periodo superior a 10 días, recuerda que es importante que entres al curso desde la plataforma de forma frecuente para que no se inicie el proceso de baja en el mismo. Por tanto, te recomendamos que, tras la recepción de este mensaje, accedas al curso lo antes posible para que conste en el sistema.

Gracias y un saludo</textarea>
  </div>

  <button id="btnStart">1) Enviar correo</button>
  <div class="info">Nota: El botón de enviar no se pulsará automáticamente (Modo pruebas activo).</div>

  <script src="popup.js"></script>
</body>
</html>
